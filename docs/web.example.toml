# contextos-web example configuration
#
# This file shows every currently supported web.toml field (Phase 14).
# contextos-web loads config.toml (the vault list) read-only alongside this
# file; it never writes config.toml. See docs/config.example.toml for that
# file's own schema.

[server]
# Loopback only: contextos-web has no authentication mechanism in this
# release, so a non-loopback bind is rejected at startup rather than
# accepted and left unprotected.
bind = "127.0.0.1:7332"
# Optional. The crate's own bundled assets (CSS, JS) are embedded in the
# binary and serve /static/ with no configuration at all, on every platform
# and install layout. Set static_dir only to override or add to that
# bundled set from an external directory; an operator-provided path here is
# tried first, falling back to the embedded copy for any file it does not
# itself contain.
# static_dir = "/absolute/path/to/extra-static-assets"
# Allowed values: "error", "warn", "info", "debug", "trace"
log_level = "info"
# Empty means log to stderr only. Rotation and retention below have no
# effect (and are rejected at startup) unless this is set.
log_file = ""
# Optional. Rotates log_file once it reaches this size, in megabytes.
# Combinable with log_rotate_daily below: whichever is reached first
# triggers a rotation. Rotated files are named "{log_file}.{timestamp}".
# log_max_size_mb = 10
# Optional. Rotates log_file on every UTC calendar-day boundary.
# log_rotate_daily = false
# Optional. Deletes a rotated log file once it is older than this many
# days. Independent of log_retention_files below; when both are set, a
# rotated file is deleted once it violates either bound. Requires at least
# one of log_max_size_mb/log_rotate_daily above to be set.
# log_retention_days = 30
# Optional. Keeps only the N most recently rotated log files, deleting
# older ones. Same combination rules as log_retention_days.
# log_retention_files = 10

[server.ui]
# UI appearance defaults. Schema deferred to a later phase (web-rendering.md);
# unrecognised keys here are accepted, not validated, until that phase lands.

# MCP servers this instance may proxy tool calls to via
# POST /mcp/{server_name}/{tool_name}. The first entry is conventionally,
# but not structurally, the local contextos-mcp instance.
[[mcp_server]]
name = "contextos"
transport = "stdio"
command = "contextos"
args = ["--config", "/absolute/path/to/config.toml"]

# A second, HTTP-based example (not required).
# [[mcp_server]]
# name = "some-other-server"
# transport = "http"
# endpoint = "http://127.0.0.1:9000"
# token_env = "SOME_OTHER_SERVER_TOKEN"
